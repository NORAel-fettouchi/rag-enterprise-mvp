# Configuration Streamlit pour RAG-Enterprise MVP

[theme]
primaryColor = "#0366d6"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f6f8fa"
textColor = "#24292e"
font = "sans serif"

[client]
showErrorDetails = true
toolbarMode = "viewer"

[logger]
level = "info"

[server]
# Augmenter le timeout pour les opérations longues (téléchargement modèles, embedding)
maxUploadSize = 200
# Désactiver les avertissements FileUploader
runOnSave = true
